# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "cbe9c004ced404239513de7efc9b9d62"
name = "wishlist"
application_url = "https://wishlistapp-tsvz.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  # Mandatory GDPR compliance webhooks - required for App Store approval.
  # These use a dedicated section, not [[webhooks.subscriptions]].
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_products,write_content,read_themes"

[auth]
redirect_urls = [
  "https://wishlistapp-tsvz.onrender.com/auth/callback",
  "https://wishlistapp-tsvz.onrender.com/auth/shopify/callback",
  "https://wishlistapp-tsvz.onrender.com/api/auth/callback"
]

[app_proxy]
url = "https://wishlistapp-tsvz.onrender.com/proxy"
subpath = "wishlist"
prefix = "apps"
