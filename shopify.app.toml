# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration
client_id = "REPLACE_WITH_YOUR_CLIENT_ID"
name = "Wishlist"
handle = "wishlist"
application_url = "https://REPLACE_WITH_YOUR_APP_URL"
embedded = true

[access_scopes]
scopes = "read_products,read_customers,write_content,read_themes"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_YOUR_APP_URL/auth/callback",
  "https://REPLACE_WITH_YOUR_APP_URL/auth/shopify/callback",
  "https://REPLACE_WITH_YOUR_APP_URL/api/auth/callback"
]

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  # Mandatory GDPR compliance webhooks - required for App Store approval.
  # These use a dedicated section, not [[webhooks.subscriptions]].
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[app_proxy]
url = "https://REPLACE_WITH_YOUR_APP_URL/proxy"
subpath = "wishlist"
prefix = "apps"

[pos]
embedded = false
